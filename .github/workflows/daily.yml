name: daily

on:
  schedule:
    # Mondays and Thursdays, not daily. The upstream corpus is *disclosed*
    # HackerOne reports — a report is disclosed once and never changes, and the
    # feed adds a handful a day. Seven runs a week to pick those up cost ~1,050
    # of the 2,000 Actions minutes this account gets a month, and that allowance
    # is shared with Public-Programs, which it starved twice.
    #
    # Cron can say "twice weekly" directly, so no skip-tick guard is needed here.
    - cron: "0 6 * * 1,4"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Healthy runs were 17 to 36 minutes. Without this the job inherits the
    # 360-minute default, and from 27 August it used all of it: about six hours
    # a day, every day, on an account whose whole Actions allowance is 2,000
    # minutes a month. It took that allowance down twice and stopped the
    # unrelated Public-Programs pipeline both times.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q

      - name: Build payload dataset
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: python -m src.run --out . --confirm-minutes 25

      - name: Commit if changed
        run: |
          git config user.name "Ashik Kunjumon"
          git config user.email "45920006+ashikkunjumon@users.noreply.github.com"
          git add payloads.json payloads.txt payloads/ wordlists/ by-program/ top-payloads/ README.md data/verdicts.jsonl
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "chore: daily payload refresh"

      # Runs after the commit so it scans what is actually about to be
      # pushed, and before the push so a finding blocks it: audit.sh scans
      # committed history only, and the artifacts above are uncommitted
      # working-tree files right up until the commit step above runs. A
      # failure here fails the workflow with the commit left unpushed --
      # it stays local to the runner and is discarded, which is correct.
      - name: Pre-push audit
        run: bash scripts/audit.sh

      - name: Push
        run: git push
